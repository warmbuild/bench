name: Tests bench job

# One job of a tests-bench round (tests-bench.yml), for an entry of .github/tests-bench/scenarios.json:
#   fill       the default branch at the base commit, with Warmbuild, the test-result cache and the
#              step cache: fills the compilation cache and records the passing targets and steps
#   plain      the pull request's head commit without Warmbuild: one `xcodebuild test`, as the
#              project's own CI runs it
#   warm       the head with the Warmbuild Action: one build-for-testing with the compilation
#              cache, then the test phases one after another (tests-bench.sh phase): every test,
#              the test-result cache, test selection with it; then the package tests through the
#              step cache. The build is the same for every phase, so they share it.
#   mutate     the head without Warmbuild, the changed file broken on purpose, every test run: the
#              tests that fail must be ones the selection would have run
# The measured part starts before the Warmbuild step and ends when the tests are done.
on:
  workflow_call:
    inputs:
      entry:
        required: true
        type: string
      role:
        required: true
        type: string
      salt:
        description: Keeps the round's compile keys, test results and step results its own
        required: true
        type: string
      round:
        required: true
        type: string
      url:
        required: true
        type: string
      action:
        description: "published: warmbuild/action@v1 (v1.13.0); fixed: .github/tests-bench/fixed-action"
        required: false
        type: string
        default: published
      rotate:
        description: Which test phase the warm job runs first
        required: false
        type: string
        default: "0"

permissions:
  contents: read
  id-token: write

env:
  # The published client, for test selection (the Action runs it on pull requests only).
  CLIENT_TAG: v1.13.0

jobs:
  measure:
    name: ${{ inputs.role }}
    runs-on: ${{ fromJSON(inputs.entry).runner }}
    timeout-minutes: 90
    env:
      ENTRY: ${{ inputs.entry }}
      ROLE: ${{ inputs.role }}
      ROUND: ${{ inputs.round }}
      BENCH_SALT: ${{ inputs.salt }}
      CACHE_URL: ${{ inputs.url }}
      BASE: ${{ fromJSON(inputs.entry).base }}
      WARMBUILD: ${{ inputs.role != 'plain' && inputs.role != 'mutate' }}
      SPLIT: ${{ inputs.role == 'fill' || inputs.role == 'warm' }}
      ROTATE: ${{ inputs.rotate }}
      ACTION_KIND: ${{ inputs.action }}
      PACKAGE: ${{ fromJSON(inputs.entry).package.run || '' }}
    steps:
      - run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/dd" >> "$GITHUB_ENV"
          echo "BENCH_OUT=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"
          echo "SRC=$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sw_vers
      - uses: actions/checkout@v5
        with:
          path: bench
      - uses: actions/checkout@v5
        with:
          repository: ${{ fromJSON(inputs.entry).repository }}
          ref: ${{ inputs.role == 'fill' && fromJSON(inputs.entry).base || fromJSON(inputs.entry).head }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Select Xcode
        env:
          XCODE: ${{ fromJSON(inputs.entry).xcode }}
        run: |
          newest=$(ls -d /Applications/Xcode_"$XCODE"*.app 2> /dev/null | sort -V | tail -n 1)
          [ -n "$newest" ] || { echo "::error::no Xcode $XCODE here"; exit 1; }
          sudo xcode-select -s "$newest"
          xcodebuild -version
      # The same commit as warmbuild/action@v1: the warm job runs its test-cache step and test
      # selection from it, several times in one job.
      - name: The Action under test
        if: inputs.role == 'warm' || inputs.role == 'mutate'
        run: |
          action="$GITHUB_WORKSPACE/bench/.github/tests-bench/fixed-action"
          if [ "$ACTION_KIND" != fixed ]; then
            action="$RUNNER_TEMP/wb-action"
            git clone -q --depth 1 --branch "$CLIENT_TAG" https://github.com/warmbuild/action "$action"
          fi
          echo "WARMBUILD_ACTION=$action" >> "$GITHUB_ENV"
          echo "WARMBUILD_CLIENT=$action/action/client/warmbuild.mjs" >> "$GITHUB_ENV"
      - name: The project's own skipped tests
        run: bench/.github/scripts/tests-bench.sh skips
      - name: Break the changed file
        if: inputs.role == 'mutate'
        run: |
          bench/.github/scripts/tests-bench.sh mutate
          git -C src diff --stat
      # A hosted runner is handed over while macOS is still starting; every job starts its
      # measured part on a machine that has settled (load average below 4), as in bench.yml.
      - name: Wait for the runner to settle
        run: |
          start=$SECONDS
          until sysctl -n vm.loadavg | awk '{ exit !($2 < 4) }'; do
            [ $((SECONDS - start)) -lt 600 ] || break
            sleep 5
          done
          echo "settled after $((SECONDS - start)) s"
          uptime
      - name: Start the clock
        run: |
          bench/.github/scripts/tests-bench.sh clock-start
          bench/.github/scripts/tests-bench.sh mark action start
      - uses: warmbuild/action@v1
        id: warmbuild
        if: env.WARMBUILD == 'true' && inputs.action != 'fixed'
        with:
          url: ${{ inputs.url }}
          workspace: ${{ github.workspace }}/src
          # Only the default branch's job records passes; head jobs leave nothing for each other.
          report: ${{ inputs.role == 'fill' && 'true' || 'false' }}
      - uses: ./bench/.github/tests-bench/fixed-action
        id: warmbuild-fixed
        if: env.WARMBUILD == 'true' && inputs.action == 'fixed'
        with:
          url: ${{ inputs.url }}
          workspace: ${{ github.workspace }}/src
          report: ${{ inputs.role == 'fill' && 'true' || 'false' }}
      - name: Warmbuild step done
        run: bench/.github/scripts/tests-bench.sh mark action stop
      - name: Test selection, for the check
        if: inputs.role == 'mutate'
        env:
          SELECT_SAMPLE: "0"
          SELECT_FLAGS: --no-hints
        run: bench/.github/scripts/tests-bench.sh select "$BASE"
      - name: Build and test
        if: env.SPLIT != 'true'
        run: bench/.github/scripts/tests-bench.sh test
      - name: Build for testing
        if: env.SPLIT == 'true'
        run: bench/.github/scripts/tests-bench.sh build
      - name: Test phases
        if: inputs.role == 'warm'
        run: bench/.github/scripts/tests-bench.sh phases
      - name: Test cache plan starts
        if: inputs.role == 'fill'
        run: bench/.github/scripts/tests-bench.sh mark plan start
      - uses: warmbuild/action/test-cache@v1
        id: tests
        if: inputs.role == 'fill' && inputs.action != 'fixed'
        with:
          url: ${{ inputs.url }}
          derived-data: ${{ env.DERIVED_DATA }}
          destination: platform=macOS
          args: ${{ env.SKIP_ARGS }}
          workspace: ${{ github.workspace }}/src
          extra-key: ${{ inputs.salt }}
      - uses: ./bench/.github/tests-bench/fixed-action/test-cache
        id: tests-fixed
        if: inputs.role == 'fill' && inputs.action == 'fixed'
        with:
          url: ${{ inputs.url }}
          derived-data: ${{ env.DERIVED_DATA }}
          destination: platform=macOS
          args: ${{ env.SKIP_ARGS }}
          workspace: ${{ github.workspace }}/src
          extra-key: ${{ inputs.salt }}
      - name: Test cache plan done
        if: inputs.role == 'fill'
        run: bench/.github/scripts/tests-bench.sh mark plan stop
      - name: Test
        if: inputs.role == 'fill' && steps.tests.outputs.tests != 'none' && steps.tests-fixed.outputs.tests != 'none'
        run: bench/.github/scripts/tests-bench.sh run-tests
      - name: Package tests
        if: env.PACKAGE != '' && env.SPLIT != 'true' && inputs.role != 'mutate'
        run: bench/.github/scripts/tests-bench.sh package
      - name: Package tests start
        if: env.PACKAGE != '' && env.SPLIT == 'true'
        run: bench/.github/scripts/tests-bench.sh mark package start
      - uses: warmbuild/action/step-cache@v1
        if: env.PACKAGE != '' && env.SPLIT == 'true' && inputs.action != 'fixed'
        continue-on-error: true
        with:
          url: ${{ inputs.url }}
          name: ${{ fromJSON(inputs.entry).package.name }}
          run: cd "$SRC" && ${{ fromJSON(inputs.entry).package.run }}
          package-path: ${{ github.workspace }}/src/${{ fromJSON(inputs.entry).package.path }}
          workspace: ${{ github.workspace }}/src
          extra-key: ${{ inputs.salt }}
      - uses: ./bench/.github/tests-bench/fixed-action/step-cache
        if: env.PACKAGE != '' && env.SPLIT == 'true' && inputs.action == 'fixed'
        continue-on-error: true
        with:
          url: ${{ inputs.url }}
          name: ${{ fromJSON(inputs.entry).package.name }}
          run: cd "$SRC" && ${{ fromJSON(inputs.entry).package.run }}
          package-path: ${{ github.workspace }}/src/${{ fromJSON(inputs.entry).package.path }}
          workspace: ${{ github.workspace }}/src
          extra-key: ${{ inputs.salt }}
      - name: Package tests done
        if: env.PACKAGE != '' && env.SPLIT == 'true'
        run: bench/.github/scripts/tests-bench.sh mark package stop
      - name: Stop the clock
        if: always()
        env:
          TESTS_PLANNED: ${{ steps.tests.outputs.tests || steps.tests-fixed.outputs.tests }}
        run: bench/.github/scripts/tests-bench.sh clock-stop
      - name: Test results
        if: always() && inputs.role != 'warm'
        run: bench/.github/scripts/tests-bench.sh results test || true
      - name: Mutation check
        if: always() && inputs.role == 'mutate'
        run: bench/.github/scripts/tests-bench.sh verify
      - name: Keep the server's counters
        if: always() && env.WARMBUILD == 'true'
        env:
          STATS: ${{ steps.warmbuild.outputs.stats || steps.warmbuild-fixed.outputs.stats }}
        run: |
          cp "$STATS" "$BENCH_OUT/stats.json" || true
          cp "$RUNNER_TEMP/warmbuild/test-cache.json" "$BENCH_OUT/" || true
          cp "$RUNNER_TEMP"/warmbuild/steps/*.json "$BENCH_OUT/" 2> /dev/null || true
          grep -cE '^ *[0-9.]+ Cache hit' "$BENCH_OUT"/build.log "$BENCH_OUT"/test.log 2> /dev/null || true
          grep -cE '^ *[0-9.]+ Cache miss' "$BENCH_OUT"/build.log "$BENCH_OUT"/test.log 2> /dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ fromJSON(inputs.entry).name }}-${{ inputs.round }}-${{ inputs.role }}${{ inputs.action == 'fixed' && '-fixed' || '' }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/*.txt
            ${{ runner.temp }}/bench/*.log
